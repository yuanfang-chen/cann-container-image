name: Test basehw Image Build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test_basehw_build.yml'
      - 'cann/9.0.0-beta.2-910b-ubuntu22.04-py3.11/**'
  push:
    paths:
      - '.github/workflows/test_basehw_build.yml'
      - 'cann/9.0.0-beta.2-910b-ubuntu22.04-py3.11/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Generate throwaway CA for COMPANY_CA_DIR
        working-directory: cann/9.0.0-beta.2-910b-ubuntu22.04-py3.11
        run: |
          mkdir -p ci-ca
          openssl req -x509 -nodes -days 1 -subj "/CN=ci-dummy" \
            -newkey rsa:2048 -keyout /dev/null -out ci-ca/ci-dummy.crt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/cann/9.0.0-beta.2-910b-ubuntu22.04-py3.11
          file: ${{ github.workspace }}/cann/9.0.0-beta.2-910b-ubuntu22.04-py3.11/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            COMPANY_CA_DIR=ci-ca
          outputs: type=image
          provenance: false
